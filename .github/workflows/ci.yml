# Prüfungen bei jedem Push und Pull Request: Typen, Unit- und Integrationstests,
# Web-Export und Browser-Tests des klickbaren Entwurfs sowie der App gegen die echte API.
# Ein grüner Lauf ist KEIN Nachweis für iOS-, Android- oder Windows-Builds.
name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typen und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Nur für den kurzlebigen Testcontainer; kein Geheimnis.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: werkstatt
          POSTGRES_DB: werkstatt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werkstatt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://werkstatt@localhost:5432/werkstatt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  app-web:
    name: App (Web-Export und Browser-Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Immer installieren: sonst fehlt der pnpm-Speicher und das Cache-Speichern schlägt fehl.
      - run: pnpm install --frozen-lockfile
      - id: app
        name: App vorhanden?
        run: if [ -f apps/app/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.app.outputs.exists == 'true'
        name: Native JS-Bundles (iOS/Android, Hermes) erzeugen, kein nativer Build
        working-directory: apps/app
        run: npx expo export --platform android --platform ios --output-dir dist-native
      - if: steps.app.outputs.exists == 'true'
        run: pnpm --filter @werkstatt/app export:demo
      - if: steps.app.outputs.exists == 'true'
        run: pnpm --filter @werkstatt/app exec playwright install --with-deps chromium
      - if: steps.app.outputs.exists == 'true'
        run: pnpm --filter @werkstatt/app e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/app/playwright-report
          retention-days: 7

  app-api:
    name: App gegen echte API (Browser-Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          # Nur für den kurzlebigen Testcontainer; kein Geheimnis.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: werkstatt
          POSTGRES_DB: werkstatt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werkstatt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # e2e-server legt daraus die frische Datenbank werkstatt_e2e an; Passwort der Testkonten
      # erzeugt playwright.api.config.ts je Lauf zufällig.
      E2E_ADMIN_DATABASE_URL: postgres://werkstatt@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @werkstatt/app export:api-e2e
      - run: pnpm --filter @werkstatt/app exec playwright install --with-deps chromium
      - run: pnpm --filter @werkstatt/app e2e:api
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-artefakte
          path: apps/app/test-results-api/artefakte
          retention-days: 7
